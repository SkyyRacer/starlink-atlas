name: Publier Atlas et actualiser les données
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rearm_sources:
        description: Réautoriser une source arrêtée après correction de la cause
        type: boolean
        default: false
  schedule:
    # Every two hours, offset from the hour to reduce scheduler congestion.
    - cron: '23 */2 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: atlas-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            web-core/target
          key: rust-atlas-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/cache/restore@v4
        id: collection
        with:
          path: data-runtime
          key: atlas-collection-${{ github.run_id }}
          restore-keys: atlas-collection-
      - name: Préparer le cache public de collecte
        run: |
          mkdir -p data-runtime
          if [ ! -f data-runtime/satcat.json ]; then cp data-seed/*.* data-runtime/; fi
          for file in gp-proba-2.json proba-2-catalog.json proba-2-attempt.txt proba-2-fetched.txt gp-proba-3.json proba-3-catalog.json proba-3-attempt.txt proba-3-fetched.txt gp-mev-1.json mev-1-catalog.json mev-1-attempt.txt mev-1-fetched.txt gp-mev-2.json mev-2-catalog.json mev-2-attempt.txt mev-2-fetched.txt gp-lares-2.json lares-2-catalog.json lares-2-attempt.txt lares-2-fetched.txt gp-debris.json debris-catalog.json debris-attempt.txt debris-fetched.txt gp-beidou.json beidou-catalog.json beidou-attempt.txt beidou-fetched.txt gp-cosmo-skymed.json cosmo-skymed-catalog.json cosmo-skymed-attempt.txt cosmo-skymed-fetched.txt gp-globalstar.json globalstar-catalog.json globalstar-attempt.txt globalstar-fetched.txt gp-glonass.json glonass-catalog.json glonass-attempt.txt glonass-fetched.txt gp-goes.json goes-catalog.json goes-attempt.txt goes-fetched.txt gp-iceye.json iceye-catalog.json iceye-attempt.txt iceye-fetched.txt gp-iridium.json iridium-catalog.json iridium-attempt.txt iridium-fetched.txt gp-meteosat.json meteosat-catalog.json meteosat-attempt.txt meteosat-fetched.txt gp-oneweb.json oneweb-catalog.json oneweb-attempt.txt oneweb-fetched.txt gp-pleiades-neo.json pleiades-neo-catalog.json pleiades-neo-attempt.txt pleiades-neo-fetched.txt gp-sentinel.json sentinel-catalog.json sentinel-attempt.txt sentinel-fetched.txt gp-gps.json gps-catalog.json gps-attempt.txt gps-fetched.txt gp-galileo.json galileo-catalog.json galileo-attempt.txt galileo-fetched.txt gp-iss.json iss-catalog.json iss-missions.json iss-evas.json iss-missions-attempt.txt iss-missions-full.txt iss-evas-attempt.txt iss-evas-full.txt; do
            if [ ! -f "data-runtime/$file" ] && [ -f "data-seed/$file" ]; then cp "data-seed/$file" "data-runtime/$file"; fi
          done
          for file in data-seed/gp-backup-*.json; do
            if [ -f "$file" ] && [ ! -f "data-runtime/$(basename "$file")" ]; then cp "$file" data-runtime/; fi
          done
          for file in data-seed/*-catalog.json; do
            if [ ! -f "data-runtime/$(basename "$file")" ]; then cp "$file" data-runtime/; fi
          done
      - name: Réarmer une source uniquement sur demande explicite
        if: github.event_name == 'workflow_dispatch' && inputs.rearm_sources
        run: find data-runtime -maxdepth 1 -name '*stopped.txt' -delete
      - name: Installer Rust et la cible navigateur
        run: rustup toolchain install 1.87.0 --profile minimal --target wasm32-unknown-unknown
      - name: Vérifier et compiler le serveur et le moteur navigateur
        run: |
          cargo +1.87.0 test --locked
          cargo +1.87.0 build --locked --release
          cargo +1.87.0 build --manifest-path web-core/Cargo.toml --locked --target wasm32-unknown-unknown --release
      - name: Collecter les données publiques si le cycle est échu
        env:
          DATA_DIR: data-runtime
          HISTORY_DIR: data-seed/history
          KEEPTRACK_API_KEY: ${{ secrets.KEEPTRACK_API_KEY }}
        run: |
          target/release/starlink-atlas --collect-once
          for file in data-runtime/*stopped.txt; do
            if [ -f "$file" ]; then echo "::warning::Une source a interrompu sa collecte : $file. Le cache validé reste publié."; fi
          done
      - name: Actualiser les trajectoires des missions lointaines
        run: python3 scripts/import_mission_ephemerides.py --recent --keep-on-error --cache-dir data-runtime/horizons-cache
      - name: Construire le site autonome
        env:
          KEEPTRACK_API_KEY: ${{ secrets.KEEPTRACK_API_KEY }}
        run: python3 scripts/build_static.py --output public --data-dir data-runtime --history-dir data-seed/history --compact-cache --remote-history "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/data-seed/history/"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data-runtime
          key: atlas-collection-${{ github.run_id }}
      - name: Vérifier le moteur WASM
        run: |
          node tests/wasm.cjs public
          node tests/publication-coverage.cjs public
      - name: Vérifier le rendu réel des points et modèles 3D
        if: github.event_name != 'schedule'
        run: |
          npm install --prefix "$RUNNER_TEMP/atlas-render-check" --no-audit --no-fund playwright@1.56.1 pngjs@7
          "$RUNNER_TEMP/atlas-render-check/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/atlas-render-check/node_modules" node tests/render-browser.cjs public
      - name: Préparer les fichiers GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Mettre le site en ligne
        id: deployment
        uses: actions/deploy-pages@v4
